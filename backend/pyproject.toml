[project]
name = "village-outreach-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.156.4",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "SQLAlchemy==2.0.55",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "PyJWT[crypto]==2.15.1",
    "cryptography==50.0.2",
    "Pillow==13.0.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["database: requires an opted-in disposable PostgreSQL database"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
